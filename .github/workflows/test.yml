name: Test application
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.js
      - name: Check PHP syntax
        run: find api -name '*.php' -print0 | xargs -0 -n1 php -l
