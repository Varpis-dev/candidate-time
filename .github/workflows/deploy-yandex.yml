name: Deploy to Yandex Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-yandex
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
      YC_REGISTRY: ${{ vars.YC_REGISTRY }}
      YC_SA_ID: ${{ vars.YC_SA_ID }}
      YC_CONTAINER_NAME: ${{ vars.YC_CONTAINER_NAME }}
      PUBLIC_HOST: ${{ vars.PUBLIC_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Проверка установки и синтаксиса
        run: |
          node --test tests/*.test.js
          find api -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Проверка настроек
        run: |
          for v in YC_FOLDER_ID YC_REGISTRY YC_SA_ID YC_CONTAINER_NAME; do
            if [ -z "${!v}" ]; then echo "::error::Не задана переменная $v"; exit 1; fi
          done
          if [ -z "${{ secrets.YC_SA_JSON_KEY }}" ]; then echo "::error::Не задан секрет YC_SA_JSON_KEY"; exit 1; fi

      - name: Установка Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i /opt/yc -n
          echo "/opt/yc/bin" >> "$GITHUB_PATH"

      - name: Авторизация
        env:
          YC_KEY: ${{ secrets.YC_SA_JSON_KEY }}
        run: |
          printf '%s' "$YC_KEY" > /tmp/key.json
          yc config set endpoint api.cloud.yandex.net:443
          yc config set service-account-key /tmp/key.json
          yc config set folder-id "$YC_FOLDER_ID"
          REG_HOST="${YC_REGISTRY%%/*}"
          yc iam create-token | docker login --username iam --password-stdin "$REG_HOST"

      - name: Сборка и загрузка образа
        run: |
          IMAGE="$YC_REGISTRY/$YC_CONTAINER_NAME:${GITHUB_SHA::12}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Контейнер (создаётся при первом запуске)
        run: |
          if ! yc serverless container get --name "$YC_CONTAINER_NAME" --folder-id "$YC_FOLDER_ID" >/dev/null 2>&1; then
            yc serverless container create --name "$YC_CONTAINER_NAME"
          fi
          yc serverless container allow-unauthenticated-invoke --name "$YC_CONTAINER_NAME"
          URL=$(yc serverless container get --name "$YC_CONTAINER_NAME" --folder-id "$YC_FOLDER_ID" --format json | jq -r .url)
          if [ -z "$PUBLIC_HOST" ]; then
            HOST=$(echo "$URL" | sed -E 's#^https?://##; s#/.*$##')
            echo "PUBLIC_HOST=$HOST" >> "$GITHUB_ENV"
          fi


      - name: Диагностика доступа перед публикацией
        run: |
          DEPLOY_ACCOUNT_ID=$(jq -r '.service_account_id' /tmp/key.json)
          echo "Deploy account: $DEPLOY_ACCOUNT_ID"
          echo "Revision account: $YC_SA_ID"
          yc iam service-account get --id "$YC_SA_ID" --format json | jq '{id, name, folder_id}'
          yc resource-manager folder list-access-bindings --id "$YC_FOLDER_ID" --format json | jq --arg deploy "$DEPLOY_ACCOUNT_ID" --arg runtime "$YC_SA_ID" '[.[] | select(.subject.id == $deploy or .subject.id == $runtime)]'
          yc serverless container revision list --container-name "$YC_CONTAINER_NAME" --format json | jq '[.[] | {id, status, service_account_id, image: .image.image_url}]'
          echo "Roles granted on the service account resource:"
          yc iam service-account list-access-bindings --id "$YC_SA_ID" --format json | jq --arg account "$DEPLOY_ACCOUNT_ID" '[.[] | select(.subject.id == $account) | {role_id, subject}]' || true
          echo "Current container identity:"
          yc serverless container get --name "$YC_CONTAINER_NAME" --folder-id "$YC_FOLDER_ID" --format json | jq '{id, name, folder_id}'
          docker manifest inspect "$IMAGE" | jq '{schemaVersion, mediaType, manifests}'

      - name: Новая ревизия
        run: |
          DEPLOY_IAM_TOKEN=$(yc iam create-token)
          echo "::add-mask::$DEPLOY_IAM_TOKEN"
          export YC_IAM_TOKEN="$DEPLOY_IAM_TOKEN"
          yc serverless container revision deploy \
            --folder-id "$YC_FOLDER_ID" \
            --container-name "$YC_CONTAINER_NAME" \
            --image "$IMAGE" \
            --cores 1 \
            --core-fraction 100 \
            --memory 512MB \
            --concurrency 4 \
            --execution-timeout 60s \
            --service-account-id "$YC_SA_ID" \
            --environment "PUBLIC_HOST=$PUBLIC_HOST"

      - name: Проверка
        run: |
          sleep 5
          curl -fsS "https://$PUBLIC_HOST/__health"
          echo
          echo "### Готово: https://$PUBLIC_HOST/" >> "$GITHUB_STEP_SUMMARY"

      - name: Очистка
        if: always()
        run: rm -f /tmp/key.json

